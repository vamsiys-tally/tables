[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = -v --tb=short

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use real PDFs)
    regression: Bank-specific regression tests
    slow: Tests that take > 1s
    ml: Tests requiring ML models (sentence-transformers)
    requires_pdf: Tests requiring real PDF files in tests/data/

# Coverage (when using pytest-cov)
# Run with: pytest --cov=tables --cov-report=html

# Logging
log_cli = false
log_cli_level = WARNING

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
